services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9020:9020"
      - "9005:9005"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --address ":9020" --console-address ":9005"

volumes:
  minio_data: